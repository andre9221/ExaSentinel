services:
  exasol:
    image: exasol/docker-db:latest
    platform: linux/amd64
    container_name: exasol-personal
    privileged: true
    ports:
      - "8563:8563"
      - "2580:2580"
    command: init-db --node-id 11

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: exasentinel-proxy
    env_file: .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - exasol
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: exasentinel-scheduler
    command: python proxy/scheduler.py
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - exasol
    restart: unless-stopped
